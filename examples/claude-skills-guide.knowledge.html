<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Graph</title>
  <script src="https://unpkg.com/cytoscape@3/dist/cytoscape.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
/* Knowledge Distiller — viewer styles (inlined into the single output HTML) */

:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --ink: #16202b;
  --muted: #62707f;
  --line: #e2e7ee;
  --accent: #2f6fed;
  --chip-bg: #eef2f8;
  --shadow: 0 1px 3px rgba(20, 30, 45, .08), 0 4px 16px rgba(20, 30, 45, .06);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--ink);
  background: var(--bg);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.5;
}

/* ---------- Header ---------- */
#topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow);
  z-index: 5;
}

#title-block { min-width: 0; flex: 0 1 auto; }

#kg-title {
  margin: 0;
  font-size: 17px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 46vw;
}

#kg-sub {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#kg-chips {
  display: flex;
  gap: 8px;
  flex: 1 1 auto;
  flex-wrap: wrap;
}

.chip {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  background: var(--chip-bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 11px;
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}

.chip b { color: var(--ink); font-weight: 650; font-size: 13px; }
.chip.quality b { color: var(--accent); }

#search {
  flex: 0 0 auto;
  width: 230px;
  padding: 7px 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 13px;
  outline: none;
  background: #fbfcfe;
}
#search:focus { border-color: var(--accent); background: #fff; }

/* ---------- Main layout ---------- */
#main {
  flex: 1 1 auto;
  display: flex;
  min-height: 0;
}

#graph-wrap {
  position: relative;
  flex: 1 1 auto;
  min-width: 0;
  background:
    radial-gradient(circle at 1px 1px, rgba(20,30,45,.05) 1px, transparent 0) 0 0 / 22px 22px,
    var(--bg);
}

#cy {
  position: absolute;
  inset: 0;
}

.load-error {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.6;
}
.load-error b { color: var(--ink); display: block; margin-bottom: 6px; font-size: 16px; }

/* ---------- Legend ---------- */
#legend {
  position: absolute;
  left: 12px;
  bottom: 12px;
  max-width: 260px;
  max-height: 45%;
  overflow: auto;
  background: rgba(255, 255, 255, .94);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 8px 10px;
  font-size: 12px;
  backdrop-filter: blur(4px);
}
#legend .legend-title {
  font-weight: 650;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .04em;
  font-size: 10px;
  margin-bottom: 6px;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 5px;
  border-radius: 6px;
  cursor: pointer;
  user-select: none;
}
.legend-item:hover { background: var(--chip-bg); }
.legend-item.active { background: #e4ecfd; }
.legend-swatch {
  width: 13px;
  height: 13px;
  border-radius: 4px;
  flex: 0 0 auto;
  border: 1px solid rgba(0,0,0,.12);
}
.legend-item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Side detail pane ---------- */
#side {
  flex: 0 0 360px;
  width: 360px;
  background: var(--panel);
  border-left: 1px solid var(--line);
  overflow-y: auto;
  padding: 18px;
}

#detail h2 {
  margin: 0 0 2px;
  font-size: 19px;
  line-height: 1.25;
}

#detail .pane-hint {
  color: var(--muted);
  font-size: 13px;
  margin-top: 4px;
}

.meta-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin: 8px 0 4px;
}

.badge {
  display: inline-block;
  font-size: 11px;
  padding: 2px 9px;
  border-radius: 999px;
  background: var(--chip-bg);
  color: var(--muted);
  border: 1px solid var(--line);
}
.badge.cluster { background: var(--cluster-bg, #eef2f8); color: #fff; border: none; font-weight: 600; }
.badge.conf-high { background: #e6f4ec; color: #1c7a45; border-color: #c5e6d3; }
.badge.conf-medium { background: #fff4e0; color: #9a6400; border-color: #f3e0b8; }
.badge.conf-low { background: #fdecec; color: #b23b3b; border-color: #f4cccc; }
.badge.superseded { background: #eceff3; color: #6b7785; border-color: #d9dee6; }

.temporal-line {
  font-size: 12px;
  color: var(--muted);
  background: var(--chip-bg);
  border-radius: 8px;
  padding: 6px 10px;
  margin: 8px 0;
}
.temporal-line code { color: var(--ink); }

.section-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
  margin: 16px 0 4px;
}

.detail-md { font-size: 13.5px; }
.detail-md p { margin: 4px 0; }
.detail-md ul { margin: 4px 0; padding-left: 20px; }
.detail-md li { margin: 3px 0; }
.detail-md code { background: var(--chip-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

.cite-list, .link-list { list-style: none; margin: 4px 0; padding: 0; }
.cite-list li { margin: 5px 0; font-size: 12.5px; color: var(--muted); }
.cite-list .cn { color: var(--accent); font-weight: 700; margin-right: 4px; }
.cite-list a { color: var(--accent); text-decoration: none; }
.cite-list a:hover { text-decoration: underline; }

.link-list li { margin: 4px 0; font-size: 13px; }
.link-list a, .node-link {
  color: var(--accent);
  cursor: pointer;
  text-decoration: none;
}
.link-list a:hover, .node-link:hover { text-decoration: underline; }
.edge-type {
  display: inline-block;
  font-size: 10px;
  color: var(--muted);
  background: var(--chip-bg);
  border-radius: 4px;
  padding: 0 6px;
  margin-right: 6px;
}

/* ---------- Overview (facts / open questions) ---------- */
.facts-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
  margin: 4px 0;
}
.facts-table th, .facts-table td {
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.facts-table th {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--muted);
}
.facts-table td .v { font-weight: 600; }

.oq-list { margin: 4px 0; padding-left: 18px; font-size: 13px; }
.oq-list li { margin: 6px 0; }

.empty { color: var(--muted); font-size: 13px; font-style: italic; }

  </style>
</head>

    <div id="title-block">
      <h1 id="kg-title">Knowledge Graph</h1>

    <input id="search" type="search" placeholder="Search concepts…" autocomplete="off" spellcheck="false">
  </header>

  <div id="main">
    <div id="graph-wrap">
      <div id="cy"></div>
      <div id="legend"></div>
    </div>
    <aside id="side">
      <div id="detail"></div>
    </aside>
  </div>

instructions", "concepts": ["workflow-patterns"]}, {"id": "troubleshooting", "label": "Troubleshooting", "description": "Common failure modes and their solutions", "concepts": ["troubleshooting-reference"]}], "nodes": [{"id": "skill", "label": "Skill", "cluster": "skill-anatomy", "confidence": "high", "definition": "A skill is a folder-based instruction package that teaches Claude how to handle specific tasks or workflows. It consists of a required SKILL.md file (Markdown with YAML frontmatter) and optional subdirectories: scripts/ (executable code), references/ (documentation), and assets/ (templates, fonts, icons).", "relevance": "Skills eliminate the need to re-explain preferences and workflows in every conversation. They encode repeatable processes once, making Claude's behavior consistent and automating multi-step workflows. For MCP builders, skills add the knowledge layer on top of raw tool access.", "resource": null, "statements": ["A skill must contain exactly one SKILL.md file (case-sensitive); the folder name must be kebab-case. [1]", "Skills work identically across Claude.ai, Claude Code, and the API without modification.", "Claude can load multiple skills simultaneously; each skill must work alongside others.", "Skills are most powerful for repeatable workflows: document generation, consistent research methodology, multi-step process orchestration.", "A first working skill can be built and tested in 15-30 minutes using the skill-creator skill."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}], "note": "The guide uses a kitchen analogy: MCP is the professional kitchen (tools and ingredients); skills are the recipes (how to use them). This cleanly separates connectivity concerns from workflow knowledge."}, {"id": "yaml-frontmatter", "label": "YAML Frontmatter", "cluster": "skill-anatomy", "confidence": "high", "definition": "The YAML frontmatter block (delimited by ---) at the top of SKILL.md is the metadata section that Claude reads to decide whether to load the skill. It is the first level of the progressive disclosure system, always loaded into the system prompt even before the full skill body.", "relevance": "The frontmatter is the most critical part of a skill. A poorly written description causes under-triggering (skill never loads) or over-triggering (skill loads for unrelated tasks). The description field is the primary trigger mechanism.", "resource": null, "statements": ["Only two fields are required: name (kebab-case) and description (what it does + when to use it, under 1024 characters, no XML angle brackets). [1]", "description MUST include both what the skill does and trigger conditions with specific phrases users would say.", "Optional fields: license, allowed-tools, compatibility (1-500 chars), metadata (author, version, mcp-server, category, tags).", "Forbidden in frontmatter: XML angle brackets < > and skill names containing 'claude' or 'anthropic' (reserved namespace).", "Debugging: Ask Claude 'When would you use the [skill name] skill?' to surface what is triggering or not triggering it."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "progressive-disclosure", "label": "Progressive Disclosure", "cluster": "design-principles", "confidence": "high", "definition": "A three-level loading system that minimizes token consumption while preserving specialized expertise. Level 1 (YAML frontmatter) is always loaded. Level 2 (SKILL.md body) loads when Claude judges the skill relevant. Level 3 (linked files in references/) loads only when specifically needed within a task.", "relevance": "Without progressive disclosure, having many skills enabled would flood the system prompt with irrelevant instructions, degrading performance. This system allows 20-50 skills to coexist without interference.", "resource": null, "statements": ["Keep SKILL.md under 5,000 words; move detailed documentation to references/. [1]", "The practical limit before context degradation is 20-50 simultaneously enabled skills.", "References/ files are Claude-navigable: Claude discovers and loads them only as needed.", "Critical instructions should appear at the top of SKILL.md, not buried in later sections."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "mcp", "label": "MCP (Model Context Protocol)", "cluster": "design-principles", "confidence": "high", "definition": "The Model Context Protocol (MCP) is a connectivity layer that gives Claude access to external services and tools (Notion, Asana, Linear, etc.) and provides real-time data access and tool invocation. In the skills ecosystem, MCP answers 'what Claude can do' while skills answer 'how Claude should do it'.", "relevance": "For skill builders working with MCP integrations, skills serve as the knowledge and workflow layer on top of raw MCP tool access. Without skills, MCP users face a blank slate — they have tool access but no workflow guidance.", "resource": "https://modelcontextprotocol.io", "statements": ["MCP provides connectivity; skills provide the workflow knowledge and best practices on top. [1]", "Without skills, MCP users face each conversation from scratch, inconsistent results, and support requests about how to use the integration.", "With skills, pre-built workflows activate automatically, best practices are embedded in every interaction, and the learning curve is reduced.", "Skills for MCP (Category 3) coordinate multiple MCP calls in sequence and embed domain expertise.", "MCP connection issues should be tested independently from the skill — call an MCP tool directly without the skill to isolate whether the failure is in MCP or the skill."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "skill-use-case-categories", "label": "Skill Use Case Categories", "cluster": "planning-use-cases", "confidence": "high", "definition": "Anthropic has identified three canonical skill use case categories based on patterns observed across early adopters and internal teams: (1) Document and Asset Creation, (2) Workflow Automation, and (3) MCP Enhancement.", "relevance": "Knowing which category a skill belongs to determines the right design patterns, technical approach, and test strategy. Categories are not mutually exclusive but most skills lean toward one.", "resource": null, "statements": ["Category 1 — Document and Asset Creation: embedded style guides and templates, quality checklists, no external tools required. Real example: frontend-design skill. [1]", "Category 2 — Workflow Automation: step-by-step workflows with validation gates, iterative refinement loops, built-in review suggestions. Real example: skill-creator skill.", "Category 3 — MCP Enhancement: coordinates multiple MCP calls in sequence, embeds domain expertise, handles common MCP errors. Real example: sentry-code-review skill from Sentry.", "Problem-first framing: user describes outcome, skill orchestrates tools. Tool-first framing: user has tool access, skill provides workflow expertise.", "Most skills lean one direction; knowing which framing fits the use case helps choose the right workflow pattern."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "use-case-definition", "label": "Use Case Definition & Success Criteria", "cluster": "planning-use-cases", "confidence": "high", "definition": "Before writing any skill instructions, identify 2-3 concrete use cases. A good use case definition specifies: trigger phrase, ordered steps, tools required, and expected result. Success criteria are defined both quantitatively (trigger rate, tool call count, API error rate) and qualitatively (user autonomy, output consistency).", "relevance": "Skills without defined use cases tend to be vague, triggering incorrectly or failing to complete workflows. Success criteria create measurable targets and a feedback loop for iteration.", "resource": null, "statements": ["Quantitative targets: 90% trigger rate on relevant queries; zero failed API calls per workflow; measurable token reduction vs. baseline. [1]", "Qualitative targets: users never need to prompt next steps; workflows complete without user correction; consistent results across sessions.", "Performance comparison benchmark: without skill = 15 messages, 3 failed API calls, 12,000 tokens; with skill = 2 questions, 0 failures, 6,000 tokens.", "Success measurement is partly vibes-based — Anthropic acknowledges active development of more robust tooling.", "Use case definition should answer: what does a user want to accomplish, what multi-step workflows are required, which tools are needed, what domain knowledge should be embedded."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "skill-description-field", "label": "Skill Description Field", "cluster": "design-principles", "confidence": "high", "definition": "The description field in YAML frontmatter is the primary mechanism by which Claude decides whether to activate a skill. It must follow the structure: [What it does] + [When to use it] + [Key capabilities]. It must include natural-language trigger phrases that real users would say.", "relevance": "This single field determines whether a skill is effective in practice. Vague descriptions lead to under-triggering; overly broad descriptions cause over-triggering.", "resource": null, "statements": ["Good description: specific, includes trigger phrases users say, mentions file types if relevant, under 1024 characters. [1]", "Bad description examples: 'Helps with projects' (too vague), 'Creates sophisticated multi-page documentation systems' (missing triggers), 'Implements the Project entity model' (too technical).", "Add negative triggers to prevent over-triggering: 'Do NOT use for simple data exploration (use data-viz skill instead).'", "For under-triggering: add more detail and domain-specific keywords. For over-triggering: add negative triggers and scope constraints.", "The description field appears in Claude's system prompt as the first level of progressive disclosure."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "testing-strategy", "label": "Testing Strategy", "cluster": "testing-iteration", "confidence": "high", "definition": "Skills should be tested at three increasing levels of rigor: (1) manual testing in Claude.ai for fast iteration, (2) scripted testing in Claude Code for repeatable validation, and (3) programmatic testing via the Skills API for systematic evaluation suites. Effective testing covers three areas: triggering tests, functional tests, and performance comparison.", "relevance": "Skills are living documents that degrade or drift without testing. The recommended approach of iterating on one challenging task until it works before broadening coverage provides faster signal.", "resource": null, "statements": ["Triggering tests: verify the skill loads on obvious tasks, paraphrased requests, and does NOT load on unrelated queries. Run 10-20 test queries. [1]", "Functional tests: verify correct outputs, successful API calls, error handling, and edge case coverage.", "Performance comparison: count messages, failed API calls, and tokens consumed with vs. without the skill enabled.", "The skill-creator skill helps design and refine skills but does NOT run automated test suites or produce quantitative evaluation results.", "Pro tip: iterate on a single challenging task to success before expanding to coverage testing — this leverages Claude's in-context learning."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "skill-iteration", "label": "Skill Iteration", "cluster": "testing-iteration", "confidence": "high", "definition": "Skills are living documents that should be iteratively improved based on operational signals. Three failure modes each have distinct solutions: under-triggering, over-triggering, and execution issues.", "relevance": "A skill that worked at launch may degrade as users discover edge cases. Iteration based on clear diagnostic signals prevents skill abandonment.", "resource": null, "statements": ["Under-triggering signals: skill doesn't load automatically, users manually enabling it, support questions about when to use it. Solution: enrich description with more keywords. [1]", "Over-triggering signals: skill loads for irrelevant queries, users disabling it, confusion about purpose. Solution: add negative triggers, be more specific about scope.", "Execution issues: inconsistent results, API failures, user corrections needed. Solution: improve instructions, add error handling.", "Advanced technique: for critical validations, use a bundled script rather than language instructions — code is deterministic, language interpretation is not."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "distribution-model", "label": "Distribution Model", "cluster": "distribution", "confidence": "high", "definition": "As of January 2026, skills are distributed by downloading and zipping a skill folder, then uploading to Claude.ai via Settings > Capabilities > Skills, or placing in the Claude Code skills directory. Organization-level deployment (shipped December 18, 2025) allows admins to deploy skills workspace-wide with automatic updates and centralized management.", "relevance": "Understanding the distribution model is necessary for both individual use and enterprise rollout. The API path enables production deployments and automated pipelines.", "resource": null, "statements": ["Individual installation: Download folder, zip, upload to Claude.ai, or place in Claude Code skills directory. [1]", "Organization deployment (since December 18, 2025): admins deploy workspace-wide with automatic updates.", "Recommended distribution: host on GitHub (public repo + clear README for humans), document in MCP repo, create installation guide.", "Skills should be positioned by outcomes, not technical details: focus on what users can accomplish, not on the folder structure.", "Note: the skill folder itself should NOT contain a README.md; the repo-level README is for human visitors only."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025-12-18", "valid_until": null, "temporal_confidence": "explicit"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "open-standard-skills-api", "label": "Open Standard & Skills API", "cluster": "distribution", "confidence": "high", "definition": "Anthropic has published Agent Skills as an open standard with the aspiration that skills should be portable across AI platforms (analogous to MCP). The Skills API provides programmatic control via /v1/skills endpoint, container.skills parameter in Messages API, version control through Claude Console, and integration with the Claude Agent SDK.", "relevance": "The open standard signals Anthropic's intent for skills to be an ecosystem-level primitive. The API path unlocks production-scale deployment and agent-system integration beyond Claude.ai.", "resource": null, "statements": ["API use cases: applications using skills programmatically, production deployments at scale, automated pipelines and agent systems. Requires Code Execution Tool beta. [1]", "Claude.ai / Claude Code use cases: end users interacting directly, manual testing during development, individual ad-hoc workflows.", "Skills can note platform-specific capabilities in the compatibility field.", "Like MCP, the goal is for skills to be portable — the same skill should work whether using Claude or other AI platforms.", "Public reference: GitHub anthropics/skills repository contains Anthropic-created skills available for customization."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}, {"id": "workflow-patterns", "label": "Workflow Patterns", "cluster": "workflow-patterns", "confidence": "high", "definition": "Five recurring structural patterns for skill instructions, distilled from early adopters and internal teams: (1) Sequential Workflow Orchestration, (2) Multi-MCP Coordination, (3) Iterative Refinement, (4) Context-Aware Tool Selection, (5) Domain-Specific Intelligence. These are heuristics, not prescriptive templates.", "relevance": "Choosing the wrong pattern leads to brittle or incomplete skills. Each pattern targets a specific class of workflow complexity.", "resource": null, "statements": ["Pattern 1 — Sequential Workflow Orchestration: multi-step processes in a specific order. Key: explicit step ordering, dependencies, validation gates, rollback instructions. [1]", "Pattern 2 — Multi-MCP Coordination: workflows spanning multiple services (e.g., Figma to Drive to Linear to Slack). Key: clear phase separation, data passing between MCPs, centralized error handling.", "Pattern 3 — Iterative Refinement: quality improves with iteration loops (initial draft, quality check, refinement, finalization). Key: explicit quality criteria, validation scripts, termination condition.", "Pattern 4 — Context-Aware Tool Selection: same outcome, different tools depending on context (e.g., file size determines cloud vs. local storage). Key: decision tree, fallback options, transparency.", "Pattern 5 — Domain-Specific Intelligence: skill adds specialized knowledge beyond tool access (e.g., compliance rules, brand standards). Key: domain expertise embedded in logic, compliance-before-action ordering, audit trail."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}], "note": "The Home Depot framing: problem-first means user describes outcome and skill orchestrates tools; tool-first means user has tool access and skill provides workflow expertise. Most skills lean one direction."}, {"id": "troubleshooting-reference", "label": "Troubleshooting Reference", "cluster": "troubleshooting", "confidence": "high", "definition": "A structured catalog of common skill failures mapped to causes and solutions. Covers upload errors, triggering issues, MCP connection failures, instruction non-compliance, and context/performance degradation.", "relevance": "Skill failures are often silent (no error, just wrong behavior). Knowing the failure taxonomy enables faster diagnosis without trial-and-error.", "resource": null, "statements": ["Upload errors: SKILL.md must be exactly this spelling (case-sensitive); YAML must have --- delimiters; name must be kebab-case; no XML angle brackets. [1]", "Skill does not trigger: description too generic, missing trigger phrases. Fix by asking Claude 'When would you use [skill name]?' and revising.", "Skill triggers too often: add negative triggers, be more specific, clarify scope explicitly.", "MCP connection issues: verify server connected, check auth tokens, test MCP independently without the skill, verify tool names are case-sensitive.", "Instructions not followed: keep concise, put critical instructions at top with Critical headers, use deterministic language, add performance notes in user prompts rather than SKILL.md.", "Large context / performance degradation: keep SKILL.md under 5,000 words, limit simultaneous skills to 20-50, use progressive disclosure."], "temporal": {"source_date": "2026-01", "source_period": null, "valid_from": "2025", "valid_until": null, "temporal_confidence": "inferred"}, "sources": ["s1"], "citations": [{"n": 1, "source": "s1", "locator": null, "label": "Building Skills for Claude — Complete Guide", "url": null}]}], "edges": [{"source": "skill", "target": "yaml-frontmatter", "type": "uses",  "Using the skill-creator skill for an initial working skill"}, {"id": "f2", "statement": "Description field maximum length", "value": "1024 characters", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "high", "source": "s1", "context": "YAML frontmatter description field constraint"}, {"id": "f3", "statement": "compatibility field maximum length", "value": "500 characters", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "high", "source": "s1", "context": "YAML frontmatter optional compatibility field"}, {"id": "f4", "statement": "SKILL.md recommended maximum size", "value": "5,000 words", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "medium", "source": "s1", "context": "Above this limit, context performance degrades; move detailed docs to references/"}, {"id": "f5", "statement": "Simultaneous skills practical limit", "value": "20-50 skills", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "medium", "source": "s1", "context": "Beyond this, context performance degrades; use selective enablement"}, {"id": "f6", "statement": "Organization-level skills feature shipped", "value": "December 18, 2025", "temporal": {"source_date": null, "source_period": null, "valid_from": "2025-12-18", "valid_until": null, "temporal_confidence": "explicit"}, "confidence": "high", "source": "s1", "context": "Workspace-wide admin deployment with automatic updates"}, {"id": "f7", "statement": "Token consumption with skill (illustrative example)", "value": "6,000 tokens (vs. 12,000 without skill)", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "low", "source": "s1", "context": "Performance comparison example in guide; 50% reduction"}, {"id": "f8", "statement": "Message count with skill (illustrative example)", "value": "2 messages (vs. 15 without skill)", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "low", "source": "s1", "context": "Performance comparison example in guide; 87% reduction"}, {"id": "f9", "statement": "Skill triggering aspirational target", "value": "90% on relevant queries", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "medium", "source": "s1", "context": "Aspirational benchmark, not a precise threshold; Anthropic developing better measurement tooling"}, {"id": "f10", "statement": "Skills API endpoint", "value": "/v1/skills", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "high", "source": "s1", "context": "For listing and managing skills programmatically; requires Code Execution Tool beta"}, {"id": "f11", "statement": "API parameter for adding skills to requests", "value": "container.skills", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "high", "source": "s1", "context": "Used in Messages API requests to include skills"}, {"id": "f12", "statement": "Public skills repository", "value": "github.com/anthropics/skills", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "high", "source": "s1", "context": "Anthropic-created reference skills available for customization"}, {"id": "f13", "statement": "Partner skills directory examples", "value": "Asana, Atlassian, Canva, Figma, Sentry, Zapier", "temporal": {"source_date": null, "source_period": null, "valid_from": "2026-01", "valid_until": null, "temporal_confidence": "inferred"}, "confidence": "high", "source": "s1", "context": "Partners with skills in the directory as of guide publication"}], "chunks": [{"id": "skill", "text": "As of early 2026: A skill is a folder-based instruction package that teaches Claude how to handle specific tasks or workflows. It consists of a required SKILL.md file with YAML frontmatter, and optional subdirectories for scripts (executable code), references (documentation), and assets (templates, fonts, icons). Skills eliminate the need to re-explain preferences and workflows in every conversation by encoding repeatable processes once, making Claude's behavior consistent and automating multi-step workflows. For MCP builders, skills add the knowledge layer on top of raw tool access. A skill must contain exactly one SKILL.md file (case-sensitive) and the folder name must be in kebab-case. Skills work identically across Claude.ai, Claude Code, and the API without modification. Claude can load multiple skills simultaneously, so each skill must work alongside others. Skills are most powerful for repeatable workflows such as document generation, consistent research methodology, and multi-step process orchestration. A first working skill can be built and tested in 15 to 30 minutes using the skill-creator skill. The guide uses a kitchen analogy: MCP is the professional kitchen providing tools and ingredients, while skills are the recipes describing how to use them.", "concepts": ["skill"], "temporal_scope": "2026", "token_estimate": 319}, {"id": "yaml-frontmatter", "text": "As of early 2026: The YAML frontmatter block delimited by triple dashes at the top of SKILL.md is the metadata section that Claude reads to decide whether to load the skill. It is always loaded into the system prompt as the first level of progressive disclosure. Only two fields are required: name in kebab-case matching the folder name, and description under 1024 characters with no XML angle brackets. The description must include both what the skill does and specific trigger conditions with phrases users would actually say. Optional fields include license, allowed-tools, compatibility for environment requirements, and metadata fields for author, version, MCP server name, category, and tags. Forbidden content includes XML angle brackets and skill names containing claude or anthropic, which are reserved to prevent prompt injection. A useful debugging technique is to ask Claude when it would use a given skill name, which causes Claude to quote back the description and reveal what is or is not triggering the skill.", "concepts": ["yaml-frontmatter"], "temporal_scope": "2026", "token_estimate": 256}, {"id": "progressive-disclosure", "text": "As of early 2026, and representing a timeless architectural principle: Progressive disclosure is a three-level loading system that minimizes token consumption while preserving specialized expertise. Level one is the YAML frontmatter, which is always loaded into the system prompt. Level two is the SKILL.md body, which loads when Claude judges the skill relevant to the current task. Level three consists of linked files in the references subdirectory, which Claude loads only when specifically needed within a task. Without progressive disclosure, having many skills enabled would flood the system prompt with irrelevant instructions and degrade performance. The system allows 20 to 50 skills to coexist without interference. SKILL.md should be kept under 5,000 words, with detailed documentation moved to references. Critical instructions should appear at the top of SKILL.md, not buried in later sections.", "concepts": ["progressive-disclosure"], "temporal_scope": "2026", "token_estimate": 227}, {"id": "mcp", "text": "As of early 2026: The Model Context Protocol (MCP) is a connectivity layer that gives Claude access to external services and tools such as Notion, Asana, and Linear, providing real-time data access and tool invocation. In the skills ecosystem, MCP answers what Claude can do while skills answer how Claude should do it. Without skills, MCP users face each conversation from scratch with inconsistent results and a steep learning curve. With skills, pre-built workflows activate automatically and best practices are embedded in every interaction. Skills for MCP integrations (Category 3) coordinate multiple MCP calls in sequence and embed domain expertise. When troubleshooting, MCP connection issues should be tested independently from the skill by calling an MCP tool directly without the skill to isolate whether a failure is in MCP or in the skill instructions.", "concepts": ["mcp"], "temporal_scope": "2026", "token_estimate": 216}, {"id": "skill-use-case-categories", "text": "As of early 2026: Anthropic has identified three canonical skill use case categories based on patterns observed across early adopters and internal teams. Category 1 is Document and Asset Creation, used for producing consistent high-quality output including documents, presentations, apps, and designs. It relies on embedded style guides, templates, and quality checklists without requiring external tools. A real example is the frontend-design skill. Category 2 is Workflow Automation, used for multi-step processes benefiting from consistent methodology and coordination across multiple MCP servers. It uses step-by-step workflows with validation gates and iterative refinement. A real example is the skill-creator skill. Category 3 is MCP Enhancement, used for workflow guidance layered on top of MCP tool access. It coordinates multiple MCP calls in sequence and embeds domain expertise. A real example is the sentry-code-review skill from Sentry. Most skills lean toward either a problem-first framing (user describes an outcome and the skill orchestrates tools) or a tool-first framing (user has tool access and the skill provides workflow expertise).", "concepts": ["skill-use-case-categories"], "temporal_scope": "2026", "token_estimate": 289}, {"id": "use-case-definition", "text": "As of early 2026: Before writing any skill instructions, it is important to identify 2 to 3 concrete use cases. A good use case definition specifies the trigger phrase, ordered steps, required tools, and expected result. Success criteria are defined both quantitatively and qualitatively. Quantitative targets include a 90% trigger rate on relevant queries, zero failed API calls per workflow, and a measurable token reduction versus a baseline. Qualitative targets include users never needing to prompt next steps, workflows completing without user correction, and consistent results across sessions. A benchmark in the guide shows that without a skill a task may require 15 back-and-forth messages, 3 failed API calls, and 12,000 tokens, while with a skill the same task requires only 2 clarifying questions, zero failures, and 6,000 tokens. Anthropic acknowledges that success measurement is partly vibes-based and that more robust tooling is under development.", "concepts": ["use-case-definition"], "temporal_scope": "2026", "token_estimate": 241}, {"id": "skill-description-field", "text": "As of early 2026: The description field in YAML frontmatter is the primary mechanism by which Claude decides whether to activate a skill. It must follow the structure of what the skill does, followed by when to use it, followed by key capabilities. It must include natural-language trigger phrases that real users would say. A good description is specific, includes trigger phrases, mentions relevant file types, and stays under 1024 characters. A bad description is too vague such as 'Helps with projects', missing triggers such as 'Creates sophisticated multi-page documentation systems', or too technical without user-facing language. To prevent over-triggering, add negative triggers explicitly stating what the skill should not be used for. For under-triggering, add more domain-specific keywords and phrasing. The description field appears in Claude's system prompt as the first level of progressive disclosure and is what Claude quotes back when asked when it would use a given skill.", "concepts": ["skill-description-field"], "temporal_scope": "2026", "token_estimate": 247}, {"id": "testing-strategy", "text": "As of early 2026: Skills should be tested at three increasing levels of rigor. Manual testing in Claude.ai is fastest with no setup required. Scripted testing in Claude Code automates test cases for repeatable validation. Programmatic testing via the Skills API builds evaluation suites that run systematically against defined test sets. Effective testing covers three areas: triggering tests to ensure the skill loads at the right times, functional tests to verify the skill produces correct outputs with successful API calls and proper error handling, and performance comparison to prove the skill improves results versus baseline. The skill-creator skill helps design and refine skills but does not execute automated test suites or produce quantitative evaluation results. The most effective approach is to iterate on a single challenging task until Claude succeeds, then extract the winning approach into the skill, before broadening to coverage testing.", "concepts": ["testing-strategy"], "temporal_scope": "2026", "token_estimate": 239}, {"id": "skill-iteration", "text": "As of early 2026: Skills are living documents that should be iteratively improved based on operational signals. Three failure modes each have distinct solutions. Under-triggering occurs when the skill doesn't load automatically, users manually enable it, or there are support questions about when to use it; the solution is to add more detail and domain-specific keywords to the description. Over-triggering occurs when the skill loads for irrelevant queries, users disable it, or there is confusion about purpose; the solution is to add negative triggers and be more specific about scope. Execution issues such as inconsistent results, API call failures, and user corrections needed point to instruction quality problems; the solution is to improve instruction clarity and add error handling. An advanced technique for critical validations is to bundle a script that performs checks programmatically rather than relying on language instructions, because code is deterministic while language interpretation is not.", "concepts": ["skill-iteration"], "temporal_scope": "2026", "token_estimate": 253}, {"id": "distribution-model", "text": "As of January 2026: Skills are distributed by downloading and zipping a skill folder, then uploading to Claude.ai via Settings, Capabilities, Skills, or by placing the folder in the Claude Code skills directory. Organization-level deployment, which shipped on December 18, 2025, allows administrators to deploy skills workspace-wide with automatic updates and centralized management. The recommended distribution approach is to host the skill on GitHub in a public repository with a clear README for human visitors (separate from the skill folder, which should not contain a README.md), to document the skill in the MCP repository, and to provide an installation guide. Skills should be positioned by the outcomes they enable for users rather than by their technical structure. Partner skills are available from companies including Asana, Atlassian, Canva, Figma, Sentry, and Zapier.", "concepts": ["distribution-model"], "temporal_scope": "2026", "token_estimate": 220}, {"id": "open-standard-skills-api", "text": "As of early 2026: Anthropic has published Agent Skills as an open standard with the aspiration that skills should be portable across AI platforms, analogous to MCP. The Skills API provides programmatic control through the /v1/skills endpoint for listing and managing skills, the container.skills parameter in Messages API requests, version control through the Claude Console, and integration with the Claude Agent SDK. API access requires the Code Execution Tool beta. The appropriate surface depends on use case: Claude.ai and Claude Code are best for end users interacting directly, manual testing, and individual ad-hoc workflows; the API is best for applications using skills programmatically, production deployments at scale, and automated pipelines and agent systems. Anthropic has been collaborating with ecosystem members on the standard and reports early adoption.", "concepts": ["open-standard-skills-api"], "temporal_scope": "2026", "token_estimate": 218}, {"id": "workflow-patterns", "text": "As of early 2026: Five recurring structural patterns for skill instructions have been distilled from early adopters and internal teams at Anthropic. Pattern 1, Sequential Workflow Orchestration, is used for multi-step processes in a specific order and relies on explicit step ordering, dependencies between steps, validation at each stage, and rollback instructions for failures. Pattern 2, Multi-MCP Coordination, is used when workflows span multiple services such as Figma, Drive, Linear, and Slack, and requires clear phase separation, data passing between MCPs, and centralized error handling. Pattern 3, Iterative Refinement, is used when output quality improves with iteration loops of drafting, quality checking, and refinement until a threshold is met. Pattern 4, Context-Aware Tool Selection, handles the same outcome with different tools depending on context, using a decision tree with fallback options and transparency about choices. Pattern 5, Domain-Specific Intelligence, embeds specialized knowledge beyond tool access such as compliance rules or financial governance, with compliance-before-action ordering and comprehensive audit trails.", "concepts": ["workflow-patterns"], "temporal_scope": "2026", "token_estimate": 288}, {"id": "troubleshooting-reference", "text": "As of early 2026: Common skill failures map to specific causes and solutions. Upload errors are caused by incorrect SKILL.md spelling (must be case-sensitive), missing YAML delimiters (triple dashes), skill names with spaces or capitals instead of kebab-case, or XML angle brackets in the frontmatter. A skill that never loads automatically usually has a description that is too generic or lacks trigger phrases users would actually say; the fix is to revise the description and ask Claude when it would use the skill to see what the model reads. A skill that triggers too often should have negative triggers added and a more specific scope statement. MCP connection failures should be isolated by testing the MCP tool directly without the skill to determine whether the issue is in the MCP server or the skill instructions. Instructions not being followed is usually caused by instructions being too verbose, buried too deep in the file, or using ambiguous language; critical checks should use explicit language such as CRITICAL: Before calling X, verify the following. Large context or performance degradation is caused by SKILL.md being too large, too many skills enabled simultaneously, or all content being loaded rather than using progressive disclosure.", "concepts": ["troubleshooting-reference"], "temporal_scope": "2026", "token_estimate": 315}], "open_questions": ["What exactly constitutes the 'Code Execution Tool beta' required for the Skills API — is this the same as Claude's built-in code execution, or a separate beta program?", "How does the open standard specification for Agent Skills differ from MCP technically? No schema or versioning details provided in this guide.", "The success metric of '90% trigger rate on relevant queries' is described as aspirational — what tooling is Anthropic developing to measure this more precisely?", "The allowed-tools field is listed as optional with example syntax but not fully documented — what is the complete list of allowed tool identifiers?", "How does the three-level progressive disclosure system handle skill conflicts when multiple skills are loaded simultaneously? No conflict resolution mechanism is described.", "The guide claims '15-30 minutes to build and test your first working skill' — this depends heavily on use-case complexity; no complexity classification is provided."]};</script>

    var title = META.title || "Knowledge Graph";
    document.title = title;
    var tEl = document.getElementById("kg-title");
    if (tEl) tEl.textContent = title;

    var date = META.distillation_date || META.distilled || META.source_date || "";
    var subParts = [];
    if (META.domain) subParts.push(esc(META.domain));
    if (date) subParts.push("distilled " + esc(date));
    var subEl = document.getElementById("kg-sub");
    if (subEl) subEl.innerHTML = subParts.join(" &middot; ");

    var concepts = (META.concept_count != null) ? META.concept_count : NODES.length;
    var rels = (META.relationship_count != null) ? META.relationship_count : EDGES.length;
    var clus = (META.cluster_count != null) ? META.cluster_count : CLUSTERS.length;

    var chips = [
      chip(concepts, "concepts"),
      chip(rels, "relationships"),
      chip(clus, "clusters")
    ];
    if (META.quality_score != null) {
      chips.push('<span class="chip quality"><b>' + esc(META.quality_score) + '</b> quality</span>');
    }
    var chipsEl = document.getElementById("kg-chips");
    if (chipsEl) chipsEl.innerHTML = chips.join("");
  }
  function chip(n, label) {
    return '<span class="chip"><b>' + esc(n) + "</b> " + esc(label) + "</span>";
  }

  /* ---------- cluster palette ---------- */
  var PALETTE = [
    "#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f",
    "#edc948", "#b07aa1", "#ff9da7", "#9c755f", "#499894",
    "#86bcb6", "#d37295", "#a0cbe8", "#8cd17d", "#b6992d"
  ];
  var DEFAULT_COLOR = "#9aa6b2";
  var clusterColor = {};
  var clusterById = {};
  CLUSTERS.forEach(function (c, i) {
    clusterColor[c.id] = PALETTE[i % PALETTE.length];
    clusterById[c.id] = c;
  });
  function colorFor(cid) { return clusterColor[cid] || DEFAULT_COLOR; }

  /* ---------- node index + superseded detection ---------- */
  var nodeById = {};
  NODES.forEach(function (n) { nodeById[n.id] = n; });

  var supersededSet = {};
  NODES.forEach(function (n) {
    var t = n.temporal || {};
    if (val(t.valid_until)) supersededSet[n.id] = true;
  });
  EDGES.forEach(function (e) {
    if (e.type === "replaces" && e.target) supersededSet[e.target] = true;
  });

  /* ---------- content-based node size ---------- */
  function nodeSize(n) {
    var nStmt = Array.isArray(n.statements) ? n.statements.length : 0;
    var defLen = (n.definition || "").length;
    var score = nStmt * 18 + defLen; // "statements.length + definition.length"
    var size = 24 + Math.sqrt(score) * 1.7; // base 24px + scaled
    return Math.max(24, Math.min(92, Math.round(size)));
  }

  setupHeader();
  renderOverview();

  /* ---------- guard: cytoscape must have loaded from CDN ---------- */
  if (typeof window.cytoscape === "undefined") {
    if (cyEl) {
      cyEl.innerHTML =
        '<div class="load-error"><b>&#9888;&#65039; Could not load Cytoscape</b>' +
        "This viewer needs internet for the CDN libs (cytoscape + marked).<br>" +
        "Reopen the file while online to see the interactive graph.<br>" +
        "Metadata, facts and open questions are still shown on the right.</div>";
    }
    return;
  }

  buildGraph();

  /* ===================================================================== */
  /* GRAPH                                                                  */
  /* ===================================================================== */
  var cy = null;
  var activeCluster = null;

  function buildGraph() {
    var elements = [];

    NODES.forEach(function (n) {
      elements.push({
        data: {
          id: n.id,
          label: n.label || n.id,
          cluster: n.cluster || "",
          definition: n.definition || "",
          color: colorFor(n.cluster),
          size: nodeSize(n),
          raw: n
        },
        classes: supersededSet[n.id] ? "superseded" : ""
      });
    });

    EDGES.forEach(function (e, i) {
      if (!nodeById[e.source] || !nodeById[e.target]) return; // skip dangling
      var weight = (typeof e.weight === "number") ? e.weight : 0.5;
      elements.push({
        data: {
          id: e.id || ("e" + i),
          source: e.source,
          target: e.target,
          type: e.type || "",
          width: 1 + Math.max(0, Math.min(1, weight)) * 4,
          raw: e
        },
        classes: e.type === "tension" ? "tension" : ""
      });
    });

    cy = cytoscape({
      container: cyEl,
      elements: elements,
      wheelSensitivity: 0.25,
      style: graphStyle(),
      layout: {
        name: "cose",
        animate: false,
        padding: 40,
        nodeRepulsion: 9000,
        idealEdgeLength: 130,
        nodeOverlap: 14,
        gravity: 0.5,
        nestingFactor: 0.9,
        componentSpacing: 90
      }
    });

    cy.on("tap", "node", function (evt) { selectNode(evt.target.id()); });
    cy.on("tap", function (evt) {
      if (evt.target === cy) {
        cy.$(":selected").unselect();
        renderOverview();
      }
    });

    buildLegend();
  }

  function graphStyle() {
    return [
      {
        selector: "node",
        style: {
          "background-color": "data(color)",
          "width": "data(size)",
          "height": "data(size)",
          "label": "data(label)",
          "font-size": 11,
          "color": "#15202b",
          "text-outline-color": "#ffffff",
          "text-outline-width": 2,
          "text-valign": "center",
          "text-halign": "center",
          "text-wrap": "wrap",
          "text-max-width": 96,
          "border-width": 1.5,
          "border-color": "rgba(0,0,0,0.18)"
        }
      },
      {
        selector: "node.superseded",
        style: {
          "background-color": "#c2c9d1",
          "opacity": 0.55,
          "color": "#7a838d",
          "border-style": "dashed"
        }
      },
      {
        selector: "node:selected",
        style: {
          "border-width": 4,
          "border-color": "#2f6fed",
          "text-outline-width": 3
        }
      },
      {
        selector: "edge",
        style: {
          "width": "data(width)",
          "label": "data(type)",
          "font-size": 9,
          "color": "#5a6672",
          "text-background-color": "#ffffff",
          "text-background-opacity": 0.85,
          "text-background-shape": "roundrectangle",
          "text-background-padding": 1,
          "curve-style": "bezier",
          "line-color": "#c2cad3",
          "target-arrow-color": "#aab4bf",
          "target-arrow-shape": "triangle",
          "arrow-scale": 0.9,
          "opacity": 0.85
        }
      },
      {
        selector: "edge.tension",
        style: {
          "line-style": "dashed",
          "line-color": "#e15759",
          "target-arrow-shape": "none",
          "source-arrow-shape": "none",
          "color": "#b23b3b"
        }
      },
      {
        selector: "edge:selected",
        style: { "line-color": "#2f6fed", "target-arrow-color": "#2f6fed", "opacity": 1 }
      },
      { selector: ".hidden", style: { "display": "none" } },
      { selector: ".cl-dim", style: { "opacity": 0.12 } },
      { selector: "node.cl-hi", style: { "opacity": 1 } }
    ];
  }

  /* ---------- legend ---------- */
  function buildLegend() {
    if (!legendEl) return;
    if (!CLUSTERS.length) { legendEl.style.display = "none"; return; }
    var html = '<div class="legend-title">Clusters &middot; click to focus</div>';
    CLUSTERS.forEach(function (c) {
      html += '<div class="legend-item" data-cluster="' + esc(c.id) + '">' +
        '<span class="legend-swatch" style="background:' + colorFor(c.id) + '"></span>' +
        "<span>" + esc(clusterLabel(c)) + "</span></div>";
    });
    legendEl.innerHTML = html;
    legendEl.querySelectorAll(".legend-item").forEach(function (item) {
      item.addEventListener("click", function () {
        var cid = item.getAttribute("data-cluster");
        toggleCluster(cid === activeCluster ? null : cid);
      });
    });
  }

  function toggleCluster(cid) {
    activeCluster = cid;
    legendEl.querySelectorAll(".legend-item").forEach(function (it) {
      it.classList.toggle("active", it.getAttribute("data-cluster") === cid);
    });
    if (!cy) return;
    cy.batch(function () {
      cy.elements().removeClass("cl-dim cl-hi");
      if (!cid) return;
      var inSet = cy.nodes('[cluster = "' + cid + '"]');
      cy.nodes().not(inSet).addClass("cl-dim");
      inSet.addClass("cl-hi");
      var keepEdges = inSet.connectedEdges();
      cy.edges().not(keepEdges).addClass("cl-dim");
    });
  }

  /* ---------- selection ---------- */
  function selectNode(id) {
    if (!cy) return;
    var n = cy.$id(id);
    if (!n || !n.length) return;
    cy.$(":selected").unselect();
    n.select();
    cy.animate({ center: { eles: n }, zoom: Math.max(cy.zoom(), 1) }, { duration: 320 });
    renderDetail(n.data("raw"));
  }
  // expose for inline link handlers
  window.__kgSelect = selectNode;

  /* ===================================================================== */
  /* DETAIL PANE                                                            */
  /* ===================================================================== */
  function temporalLine(t) {
    if (!t) return "";
    var parts = [];
    if (val(t.source_date)) parts.push("source <code>" + esc(t.source_date) + "</code>");
    if (val(t.valid_from) || val(t.valid_until)) {
      parts.push("valid <code>" + esc(t.valid_from || "?") + "</code> &rarr; <code>" +
        esc(t.valid_until || "now") + "</code>");
    }
    if (val(t.temporal_confidence)) parts.push("(" + esc(t.temporal_confidence) + ")");
    if (!parts.length) return "";
    return '<div class="temporal-line">&#128336; ' + parts.join(" &middot; ") + "</div>";
  }

  function renderDetail(n) {
    if (!n) { renderOverview(); return; }
    var html = "";
    html += "<h2>" + esc(n.label || n.id) + "</h2>";

    var c = clusterById[n.cluster];
    html += '<div class="meta-row">';
    if (c) {
      html += '<span class="badge cluster" style="--cluster-bg:' + colorFor(n.cluster) +
        ";background:" + colorFor(n.cluster) + '">' + esc(clusterLabel(c)) + "</span>";
    }
    if (n.confidence) {
      html += '<span class="badge conf-' + esc(n.confidence) + '">' + esc(n.confidence) + " confidence</span>";
    }
    if (supersededSet[n.id]) {
      html += '<span class="badge superseded">&#9888; superseded</span>';
    }
    html += "</div>";

    html += temporalLine(n.temporal);

    if (val(n.definition)) {
      html += '<div class="section-label">Definition</div><div class="detail-md">' + md(n.definition) + "</div>";
    }
    if (val(n.relevance)) {
      html += '<div class="section-label">Relevance</div><div class="detail-md">' + md(n.relevance) + "</div>";
    }

    if (Array.isArray(n.statements) && n.statements.length) {
      html += '<div class="section-label">Statements</div><div class="detail-md"><ul>';
      n.statements.forEach(function (s) {
        var inner = md(s).replace(/^\s*<p>/, "").replace(/<\/p>\s*$/, "");
        html += "<li>" + inner + "</li>";
      });
      html += "</ul></div>";
    }

    if (Array.isArray(n.citations) && n.citations.length) {
      html += '<div class="section-label">Citations</div><ul class="cite-list">';
      n.citations.forEach(function (ci) {
        var txt = esc(ci.label || ci.source || "");
        var loc = ci.locator ? " (" + esc(ci.locator) + ")" : "";
        var body = ci.url
          ? '<a href="' + esc(ci.url) + '" target="_blank" rel="noopener">' + txt + "</a>"
          : txt;
        html += '<li><span class="cn">[' + esc(ci.n != null ? ci.n : "?") + "]</span>" + body + loc + "</li>";
      });
      html += "</ul>";
    }

    // Cited by (edges targeting this node)
    var citedBy = EDGES.filter(function (e) { return e.target === n.id && nodeById[e.source]; });
    if (citedBy.length) {
      html += '<div class="section-label">Cited by</div><ul class="link-list">';
      citedBy.forEach(function (e) {
        var src = nodeById[e.source];
        html += "<li>" + edgeBadge(e.type) + nodeLink(src) + "</li>";
      });
      html += "</ul>";
    }

    // Outgoing (edges from this node)
    var outgoing = EDGES.filter(function (e) { return e.source === n.id && nodeById[e.target]; });
    if (outgoing.length) {
      html += '<div class="section-label">Outgoing</div><ul class="link-list">';
      outgoing.forEach(function (e) {
        var tgt = nodeById[e.target];
        html += "<li>" + edgeBadge(e.type) + nodeLink(tgt) + "</li>";
      });
      html += "</ul>";
    }

    detailEl.innerHTML = html;
    wireNodeLinks();
  }

  function edgeBadge(type) {
    return type ? '<span class="edge-type">' + esc(type) + "</span>" : "";
  }
  function nodeLink(n) {
    return '<a class="node-link" data-node="' + esc(n.id) + '">' + esc(n.label || n.id) + "</a>";
  }
  function wireNodeLinks() {
    detailEl.querySelectorAll(".node-link").forEach(function (a) {
      a.addEventListener("click", function () { selectNode(a.getAttribute("data-node")); });
    });
  }

  /* ===================================================================== */
  /* OVERVIEW (no node selected): facts + open questions                   */
  /* ===================================================================== */
  function renderOverview() {
    var html = '<h2>Overview</h2><div class="pane-hint">Click any node to inspect it. ' +
      "Use the legend to focus a cluster, or the search box to filter.</div>";

    if (FACTS.length) {
      html += '<div class="section-label">Key facts</div>';
      html += '<table class="facts-table"><thead><tr><th>Statement</th><th>Value</th><th>Conf.</th></tr></thead><tbody>';
      FACTS.forEach(function (f) {
        var stmt = f.statement || f.fact || "";
        html += "<tr><td>" + esc(stmt) + '</td><td class="v">' + esc(f.value || "") +
          "</td><td>" + esc(f.confidence || "") + "</td></tr>";
      });
      html += "</tbody></table>";
    }

    if (OPEN_Q.length) {
      html += '<div class="section-label">Open questions</div><ol class="oq-list">';
      OPEN_Q.forEach(function (q) {
        var t = (typeof q === "string") ? q : (q && (q.question || q.text)) || "";
        html += "<li>" + esc(t) + "</li>";
      });
      html += "</ol>";
    }

    if (!FACTS.length && !OPEN_Q.length) {
      html += '<p class="empty">No facts or open questions in this graph.</p>';
    }
    detailEl.innerHTML = html;
  }

  /* ===================================================================== */
  /* SEARCH                                                                 */
  /* ===================================================================== */
  var searchEl = document.getElementById("search");
  if (searchEl) {
    searchEl.addEventListener("input", function () { applySearch(searchEl.value); });
  }
  function applySearch(q) {
    if (!cy) return;
    q = (q || "").trim().toLowerCase();
    cy.batch(function () {
      if (!q) { cy.elements().removeClass("hidden"); return; }
      cy.nodes().forEach(function (nd) {
        var hay = ((nd.data("label") || "") + " " + (nd.data("definition") || "")).toLowerCase();
        nd.toggleClass("hidden", hay.indexOf(q) === -1);
      });
      cy.edges().forEach(function (e) {
        e.toggleClass("hidden", e.source().hasClass("hidden") || e.target().hasClass("hidden"));
      });
    });
  }
})();

  </script>
</body>
</html>
